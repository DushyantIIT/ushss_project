<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USHSS Admin — Chat Management</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0d1117;color:#e6edf3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #30363d;padding-bottom:16px}.muted{color:#8b949e;font-size:13px}.layout{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(0,1.3fr);gap:16px;margin-top:18px}.panel{border:1px solid #30363d;background:#161b22;border-radius:12px;overflow:hidden}.panel h2{font-size:15px;margin:0;padding:14px;border-bottom:1px solid #30363d}.list{max-height:70vh;overflow:auto}.item{padding:13px;border-bottom:1px solid #252b33;cursor:pointer}.item:hover,.item.active{background:#21262d}.item strong{display:block}.item small{display:block;color:#8b949e;margin-top:5px}.messages{padding:14px;max-height:70vh;overflow:auto}.message{padding:13px 0;border-bottom:1px solid #30363d}.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#8b949e;font-size:12px}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:9px 0}.stats{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 16px;min-width:150px}.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:#8b949e}input,button{font:inherit;border:1px solid #3d444d;border-radius:8px;padding:10px;background:#0d1117;color:#e6edf3}input{width:100%;margin-top:12px}button{cursor:pointer;background:#238636;border-color:#238636;font-weight:600}button.secondary{background:#21262d;border-color:#3d444d}.status{padding:10px 0;color:#f0c674;min-height:34px}@media(max-width:760px){.wrap{padding:12px}.layout{grid-template-columns:1fr}.list{max-height:34vh}.messages{max-height:none}}
</style></head><body><main class="wrap">
<header class="head"><div><h1 style="margin:0;font-size:23px">Chat Management</h1><div class="muted">Administrator-only conversation review</div></div><div><button class="secondary" onclick="location.href='/dashboard/admin'">Back to Admin Dashboard</button> <button onclick="loadAll()">Refresh</button></div></header>
<div class="status" id="status">Loading administrator chat data…</div><div class="stats"><div class="stat"><strong id="conversationCount">—</strong><span>Conversations</span></div><div class="stat"><strong id="messageCount">—</strong><span>Messages in selected conversation</span></div></div>
<div class="layout"><section class="panel"><h2>Conversations</h2><div style="padding:0 12px"><input id="search" placeholder="Search title or participant…" oninput="renderConversations()"></div><div id="conversations" class="list"></div></section>
<section class="panel"><h2 id="selectedTitle">Select a conversation</h2><div class="messages" id="messages"><div class="muted">Choose a conversation to review its messages.</div></div></section></div></main>
<script>
const token=localStorage.getItem('ushss_token');let conversations=[];let selected=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setStatus(s){$('status').textContent=s}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Authorization':'Bearer '+token,...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function loadAll(){if(!token){setStatus('Please sign in as an administrator first.');return}try{const d=await api('/api/admin/chat/conversations');conversations=d.conversations||[];$('conversationCount').textContent=conversations.length;renderConversations();setStatus('Loaded administrator chat data.');if(selected&&conversations.some(c=>String(c.id)===String(selected)))await openConversation(selected)}catch(e){setStatus(e.message+' — check your administrator session and chat API deployment.');}}
function renderConversations(){const q=($('search').value||'').toLowerCase();const list=conversations.filter(c=>[c.title,c.kind,...(c.members||[]).map(m=>m.full_name+' '+m.role),c.last_message?.body].join(' ').toLowerCase().includes(q));$('conversations').innerHTML=list.map(c=>'<div class="item '+(String(c.id)===String(selected)?'active':'')+'" onclick="openConversation(\''+esc(c.id)+'\')"><strong>'+esc(c.title||(c.kind==='direct'?'Private conversation':'Class conversation'))+'</strong><small>'+esc((c.members||[]).map(m=>m.full_name+' · '+m.role).join(', ')||'No participants')+'</small><small>'+esc(c.last_message?.body||'No messages yet').slice(0,120)+'</small></div>').join('')||'<div class="item muted">No conversations match this search.</div>'}
async function openConversation(id){selected=id;renderConversations();const c=conversations.find(x=>String(x.id)===String(id));$('selectedTitle').textContent=c?.title||(c?.kind==='direct'?'Private conversation':'Class conversation');$('messages').innerHTML='<div class="muted">Loading messages…</div>';try{const d=await api('/api/admin/chat/conversations/'+encodeURIComponent(id)+'/messages');$('messageCount').textContent=d.total||0;$('messages').innerHTML=(d.messages||[]).map(m=>'<article class="message"><div class="meta"><strong>'+esc(m.sender_name)+' · '+esc(m.sender_role)+'</strong><span>'+esc(m.created_at)+'</span></div><div class="body">'+esc(m.body)+'</div></article>').join('')||'<div class="muted">No messages in this conversation.</div>'}catch(e){$('messages').textContent=e.message;}}
loadAll();
</script></body></html>
