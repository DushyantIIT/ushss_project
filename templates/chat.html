<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">\n<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<title>USHSS — Chats</title>
<style>
:root{--bg:#FAF8F4;--surface:#fff;--surface2:#F5F1EA;--surface3:#EDE8DE;--border:#E0D9CC;--border2:#CFC6B5;--maroon:#6B1A1A;--maroon-d:#4A0E0E;--maroon-l:#8B2E2E;--gold:#C9A84C;--gold-l:#E8C97A;--ink:#1A1209;--ink-mid:#3D2B1F;--muted:#8A7B6E;--radius:10px;--shadow:0 2px 12px rgba(107,26,26,.07);font-family:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 20px;border:1px solid var(--border);border-radius:12px;background:linear-gradient(135deg,var(--maroon-d),var(--maroon) 68%,var(--maroon-l));box-shadow:var(--shadow);color:#F5F0E8}.head h1{font-family:'Playfair Display',Georgia,serif!important;color:#F5F0E8}.muted{color:var(--muted);font-size:13px}.head .muted{color:rgba(245,240,232,.76)}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;margin-top:16px;min-height:70vh}.panel{border:1px solid var(--border);background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);min-width:0}.panel h2{font-family:'Playfair Display',Georgia,serif;font-size:16px;color:var(--maroon);margin:0;padding:15px 16px;border-bottom:1px solid var(--border);background:var(--surface2)}.people,.convos{max-height:27vh;overflow:auto}.item{padding:12px 14px;border-bottom:1px solid var(--surface3);cursor:pointer;transition:background .15s}.item:hover,.item.active{background:var(--gold-pale,#FDF8EC)}.item strong{display:block;font-size:14px;color:var(--ink-mid)}.item small{color:var(--muted);font-size:11px;line-height:1.5}.messages{height:48vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,#fff,#FCFAF6)}.msg{max-width:80%;padding:11px 13px;border:1px solid var(--border);border-radius:12px 12px 12px 4px;background:var(--surface2);color:var(--ink);overflow-wrap:anywhere;line-height:1.45}.msg.mine{align-self:flex-end;background:#6B1A1A;color:#fff;border-color:#6B1A1A;border-radius:12px 12px 4px 12px}.msg small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.msg.mine small{color:rgba(255,255,255,.72)}.compose{display:flex;gap:8px;padding:13px;border-top:1px solid var(--border);background:var(--surface)}input,button{font:inherit;border:1px solid var(--border2);border-radius:8px;padding:11px 12px;background:#fff;color:var(--ink)}input{outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.15)}.compose input{flex:1;min-width:0}button{cursor:pointer;background:var(--maroon);border-color:var(--maroon);color:#fff;font-weight:600;transition:background .15s,border-color .15s}button:hover{background:var(--maroon-l);border-color:var(--maroon-l)}button.secondary{background:transparent;color:var(--maroon);border-color:rgba(201,168,76,.65)}button.secondary:hover{background:#FDF8EC}button:disabled{opacity:.5;cursor:not-allowed}.status{padding:10px 14px;color:#805B0B;font-size:12px;min-height:36px}.people .item button{margin-top:8px}.people .item button.secondary{font-size:12px;padding:7px 11px}.convos .item.active{border-left:3px solid var(--gold)}@media(max-width:700px){.layout{grid-template-columns:minmax(0,1fr)}.people,.convos{max-height:22vh}.messages{height:42vh}.wrap{padding:12px}.head{padding:15px}.panel h2{padding:13px}.msg{max-width:90%}.compose{padding:10px}}
</style></head><body><main class="wrap">
<header class="head"><div><h1 style="font-size:22px;margin:0">USHSS Chats</h1><div class="muted">Class and faculty conversations with access controls</div></div><button class="secondary" onclick="location.href='/dashboard/'+(localStorage.getItem('ushss_role')||'student')">Back to portal</button></header>
<div class="status" id="status">Loading your permitted contacts…</div>
<div class="layout"><section class="panel"><h2>People</h2><div class="people" id="people"></div><h2>Conversations</h2><div class="convos" id="convos"></div></section>
<section class="panel"><h2 id="chatTitle">Choose a conversation</h2><div class="messages" id="messages"></div><form class="compose" id="sendForm"><input id="message" maxlength="4000" placeholder="Write a message…" autocomplete="off" required><button id="sendBtn">Send</button></form></section></div>
</main><script>
const token=localStorage.getItem('ushss_token');let current=null;let poll=null;
const el=id=>document.getElementById(id);
function status(s){el('status').textContent=s}
function headers(json=false){return {'Authorization':'Bearer '+token,...(json?{'Content-Type':'application/json'}:{})}}
async function api(path,opts={}){const r=await fetch('/api/chat'+path,{...opts,headers:{...headers(!!opts.body),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadPeople(){const d=await api('/people');el('people').innerHTML=(d.people||[]).map(p=>`<div class="item"><strong>${esc(p.full_name||p.id)}</strong><small>${esc(p.role)} · ${esc([p.programme,p.batch,p.semester,p.section].filter(Boolean).join(' / '))}</small><div style="margin-top:8px"><button class="secondary" onclick='startDirect("${esc(p.id)}")'>Message</button></div></div>`).join('')||'<div class="item muted">No permitted contacts found.</div>'}
async function loadConversations(){const d=await api('/conversations');el('convos').innerHTML=(d||[]).map(c=>`<div class="item ${current===c.id?'active':''}" onclick='openChat("${esc(c.id)}","${esc(c.title||'Chat')}")'><strong>${esc(c.title|| (c.kind==='direct'?'Private chat':'Class chat'))}</strong><small>${c.last_message?esc(c.last_message.body).slice(0,70):'No messages yet'}</small></div>`).join('')||'<div class="item muted">No conversations yet. Start one from People.</div>'}
async function startDirect(id){try{const c=await api('/direct',{method:'POST',body:JSON.stringify({recipient_id:id})});await loadConversations();openChat(String(c.id),c.title||'Private chat');status('Conversation ready.')}catch(e){status(e.message)}}
async function openChat(id,title){current=id;el('chatTitle').textContent=title||'Chat';await loadConversations();await loadMessages();if(poll)clearInterval(poll);poll=setInterval(()=>loadMessages().catch(()=>{}),5000)}
async function loadMessages(){if(!current)return;const d=await api('/'+encodeURIComponent(current)+'/messages');el('messages').innerHTML=(d.messages||[]).map(m=>'<div class="msg '+(String(m.sender_id)===String(window.__uid)?'mine':'')+'">'+esc(m.body)+'<small>'+esc(m.created_at||'')+'</small></div>').join('');el('messages').scrollTop=el('messages').scrollHeight}
el('sendForm').addEventListener('submit',async e=>{e.preventDefault();if(!current)return status('Choose a conversation first.');const input=el('message');const body=input.value.trim();if(!body)return;el('sendBtn').disabled=true;try{await api('/'+encodeURIComponent(current)+'/messages',{method:'POST',body:JSON.stringify({body})});input.value='';await loadMessages();status('Message sent.')}catch(err){status(err.message)}finally{el('sendBtn').disabled=false}});
(async()=>{if(!token){status('Please sign in to use chat.');return}try{const u=await api('/me');window.__uid=u.id;await loadPeople();await loadConversations();status('Contacts and conversations loaded.')}catch(e){status(e.message)}})();
</script></body></html>
