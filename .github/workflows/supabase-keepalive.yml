name: Supabase Keepalive

on:
  schedule:
    # Run every 3 days at a flexible UTC time.
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY GitHub Actions secret."
            exit 1
          fi

          code="$(
            curl -sS -o /tmp/supabase-response.txt -w "%{http_code}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              "${SUPABASE_URL}/rest/v1/?select=*"
          )"

          echo "Supabase REST API returned HTTP ${code}"

          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "Supabase keepalive request failed."
            cat /tmp/supabase-response.txt
            exit 1
          fi
